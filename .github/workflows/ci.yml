# CI gate for every environment branch (MCA-45).
#
# App Hosting deploys natively from GitHub (develop → dev, uat → uat,
# master → prod + legacy until MCA-59). This workflow never deploys; it only
# gates. Replaces pr-checks.yml (PRs to master) and deploy.yml (pushes to
# master), which were identical and pinned the build to mcarthur-tour.
#
# Job names are the required status checks for branch protection (MCA-68).
# Renaming a job silently drops it from the protection rule, so keep them stable.

name: CI

on:
  pull_request:
    branches: [develop, uat, master]
  push:
    branches: [develop, uat, master]

# A newer push to the same PR or branch supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One Node major everywhere (MCA-64): .nvmrc here, `engines` in
          # package.json for App Hosting's buildpack, and local nvm.
          node-version-file: .nvmrc
          cache: 'npm'

      # `npm ci`: installs exactly the committed lock. The lock is generated on
      # Linux now and records every platform's optional bindings (MCA-64); the
      # old `npm install` workaround was for a Windows-generated lock.
      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:coverage

      # CI builds outside App Hosting, so there's no injected config. Build
      # against the DEV project's public web config (MCA-39), kept in repository
      # *variables*: it ships to every browser, so it isn't a secret. No
      # service-account key: the build never calls the Admin SDK with one.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          # Mirror the target environment's donations flag (MCA-71): off for
          # master (prod), on for develop/uat. base_ref on PRs, ref_name on push.
          NEXT_PUBLIC_DONATIONS_ENABLED: ${{ (github.base_ref || github.ref_name) == 'master' && 'false' || 'true' }}
        run: npm run build

  e2e:
    name: E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One Node major everywhere (MCA-64): .nvmrc here, `engines` in
          # package.json for App Hosting's buildpack, and local nvm.
          node-version-file: .nvmrc
          cache: 'npm'

      # firebase-tools' emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-firebase-emulators-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # WHY hermetic: `test:e2e` pins the emulator project `demo-mcarthur`
      # (package.json + playwright.config.ts). E2E must never reach a real
      # environment, so no Firebase config or credentials are passed here.
      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
