# Shared App Hosting config for every backend (MCA-44).
#
# Keep this file environment-neutral. App Hosting merges
# apphosting.<Environment>.yaml over it, where Environment is set on each
# backend (Settings → Environment):
#   - legacy → apphosting.legacy.yaml: the live mcarthur-tour backend's project
#     values and Secret Manager references (removed at MCA-59).
#   - dev / uat / prod → apphosting.{dev,uat,prod}.yaml: the mcarthur-web-*
#     foundation backends (emulator-safety flag only; config is injected).
#
# WHY no env vars here: the foundation backends get their Firebase config
# injected by App Hosting and run keyless (src/lib/firebaseConfig.ts). A secret
# referenced here would fail the build in any project that lacks it, and an
# environment file can't blank a base variable (App Hosting rejects `value: ""`).
# src/test/apphostingLegacy.test.ts enforces this.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 2
