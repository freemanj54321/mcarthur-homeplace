runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 2

env:
  # Non-sensitive identifiers — safe to hardcode
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mcarthur-tour
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: mcarthur-tour.firebasestorage.app
    availability: [BUILD, RUNTIME]

  # Sensitive values — stored in Firebase Secret Manager.
  # Before first deploy run:
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_API_KEY --project mcarthur-tour
  # (repeat for each secret below)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability: [BUILD, RUNTIME]

  # Server-only credential used by the Admin SDK to mint session cookies and
  # read drafts. Set with:
  #   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_JSON --project mcarthur-tour
  # (paste the entire service-account JSON when prompted)
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
